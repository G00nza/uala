<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arr-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#aaa"/>
    </marker>
  </defs>

  <!-- ── Subgraphs ── -->

  <rect x="140" y="50" width="215" height="268" rx="10" fill="#EBF4FF" stroke="#90CDF4" stroke-width="1.5"/>
  <text x="247" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#2B6CB0">APLICACIÓN (GO)</text>

  <rect x="425" y="50" width="210" height="245" rx="10" fill="#F0FFF4" stroke="#9AE6B4" stroke-width="1.5"/>
  <text x="530" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#276749">STORAGE</text>

  <rect x="425" y="318" width="210" height="185" rx="10" fill="#FFFAF0" stroke="#FBD38D" stroke-width="1.5"/>
  <text x="530" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#C05621">MENSAJERÍA</text>

  <rect x="140" y="353" width="215" height="148" rx="10" fill="#FAF5FF" stroke="#D6BCFA" stroke-width="1.5"/>
  <text x="247" y="375" text-anchor="middle" font-size="11" font-weight="600" fill="#553C9A">OBSERVABILIDAD</text>

  <!-- ── Nodes ── -->

  <ellipse cx="65" cy="190" rx="55" ry="26" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <text x="65" y="195" text-anchor="middle" font-size="13" fill="#2D3748">Cliente</text>

  <rect x="160" y="97" width="175" height="42" rx="6" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <text x="247" y="123" text-anchor="middle" font-size="13" fill="#2D3748">Handlers</text>

  <rect x="160" y="205" width="175" height="42" rx="6" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <text x="247" y="231" text-anchor="middle" font-size="13" fill="#2D3748">Use Cases</text>

  <rect x="443" y="92" width="175" height="42" rx="6" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <text x="530" y="118" text-anchor="middle" font-size="13" fill="#2D3748">PostgreSQL</text>

  <rect x="443" y="178" width="175" height="44" rx="6" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <text x="530" y="198" text-anchor="middle" font-size="13" fill="#2D3748">Redis</text>
  <text x="530" y="214" text-anchor="middle" font-size="10" fill="#718096">cache de timeline</text>

  <rect x="443" y="355" width="175" height="42" rx="6" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <text x="530" y="381" text-anchor="middle" font-size="13" fill="#2D3748">RabbitMQ</text>

  <rect x="443" y="433" width="175" height="44" rx="6" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <text x="530" y="452" text-anchor="middle" font-size="13" fill="#2D3748">Consumer</text>
  <text x="530" y="468" text-anchor="middle" font-size="10" fill="#718096">fanout / backfill</text>

  <rect x="158" y="388" width="175" height="40" rx="6" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <text x="245" y="413" text-anchor="middle" font-size="13" fill="#2D3748">Prometheus</text>

  <rect x="158" y="448" width="175" height="40" rx="6" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <text x="245" y="473" text-anchor="middle" font-size="13" fill="#2D3748">Grafana</text>

  <!-- ── Arrows ── -->

  <!-- Cliente → Handlers -->
  <line x1="118" y1="178" x2="160" y2="123" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="107" y="158" font-size="10" fill="#718096" text-anchor="middle">HTTP</text>

  <!-- Handlers → Use Cases -->
  <line x1="247" y1="139" x2="247" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Use Cases → PostgreSQL -->
  <line x1="335" y1="215" x2="443" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="362" y="175" font-size="10" fill="#718096">users / tweets / follows</text>

  <!-- Use Cases → Redis (cache hit) -->
  <line x1="335" y1="231" x2="443" y2="207" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="362" y="228" font-size="10" fill="#718096">timeline (hit)</text>

  <!-- Redis → PostgreSQL (miss fallback, dashed) -->
  <line x1="530" y1="178" x2="530" y2="134" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-dash)"/>
  <text x="548" y="160" font-size="10" fill="#aaa">miss</text>

  <!-- Use Cases → RabbitMQ (curve) -->
  <path d="M335 234 C418 234 418 376 443 376" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="388" y="284" font-size="10" fill="#718096" text-anchor="middle">tweet.created /</text>
  <text x="388" y="296" font-size="10" fill="#718096" text-anchor="middle">follow.created</text>

  <!-- RabbitMQ → Consumer (dashed, async) -->
  <line x1="530" y1="397" x2="530" y2="433" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-dash)"/>
  <text x="548" y="420" font-size="10" fill="#aaa">async</text>

  <!-- Consumer → Redis (right-side routing) -->
  <path d="M618 455 L682 455 L682 200 L618 200" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="700" y="325" font-size="10" fill="#718096">fanout /</text>
  <text x="700" y="337" font-size="10" fill="#718096">backfill</text>

  <!-- App → Prometheus (/metrics) -->
  <line x1="247" y1="318" x2="247" y2="388" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260" y="356" font-size="10" fill="#718096">/metrics</text>

  <!-- Prometheus → Grafana -->
  <line x1="247" y1="428" x2="247" y2="448" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

</svg>
